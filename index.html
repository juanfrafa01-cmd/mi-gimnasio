<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Viewport estricto mobile-first para evitar autozoom de Safari en iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0B0B0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Gimnasio">
  <meta name="description" content="Mi Gimnasio · Fitness MiniApp · © JF Development. Registro de entrenamientos, movilidad, activación, fuerza y AMRAP 100% offline.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mi Gimnasio — Fitness MiniApp">
  <meta property="og:description" content="Entrenamientos, movilidad, fuerza y progreso en una sola pantalla. Funciona 100% sin internet.">
  <meta property="og:image" content="./icons/icon-512.png">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

  <title>Fitness MiniApp — JF Development</title>

  <!-- Fuentes del sistema y Google Fonts optimizadas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos CSS nativos con variables y modo oscuro -->
  <link rel="stylesheet" href="./css/app.css">

  <!-- Fondo oscuro desde el primer instante: evita el destello blanco al abrir la app -->
  <style>:where(html, body) { background: #0B0B0D; }</style>
</head>
<body>
  <!-- Contenedor Raíz Mobile-First (probado a 390px) -->
  <div id="app-root">
    <!-- El contenido se renderiza dinámicamente mediante js/app.js -->
    <noscript>
      <div style="padding: 24px; text-align: center; color: #fff;">
        Necesitás habilitar JavaScript para usar Mi Gimnasio.
      </div>
    </noscript>
  </div>

  <!-- Arquitectura de scripts clásicos en orden estricto -->
  <script src="./js/engine.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/timer.js"></script>
  <script src="./js/app.js"></script>

  <!-- Registro del Service Worker PWA Offline-First -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js')
          .then(function (reg) {
            console.log('[SW] Service Worker registrado en:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[SW] Error al registrar Service Worker:', err);
          });
      });
    }
  </script>
</body>
</html>
